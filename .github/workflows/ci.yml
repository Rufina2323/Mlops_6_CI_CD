name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: |
          echo "Hello! My name is ${{ vars.MY_LOGIN }}. My password is ${{ secrets.MY_PASSWORD }}."

  lint:
    runs-on: ubuntu-latest
    needs: greeting
    continue-on-error: true

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install deps
        run: |
          pip install flake8

      - name: Run flake8
        run: flake8 .

  unit-tests:
    runs-on: ubuntu-latest
    needs: greeting

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest ./tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success()

    steps:
      - uses: actions/checkout@v3

      - name: Wait for manual trigger
        run: echo "Run manually from Actions tab"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run integration tests
        run: pytest ./tests/integration